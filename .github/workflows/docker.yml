name: Build Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Базовый образ с Python + ffmpeg. Слои кэшируются в GHA-cache, поэтому без
  # изменений requirements.txt пересборка занимает секунды.
  runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}-runtime" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  # Основной образ приложения. Собирается после runtime и ссылается на его
  # коммит-SHA, чтобы базовый слой был именно тот, что собран в этом же прогоне.
  app:
    needs: runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image names
        id: img
        run: |
          echo "app=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "runtime=${GITHUB_REPOSITORY,,}-runtime" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.app }}:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.app }}:${{ github.sha }}
          build-args: |
            RUNTIME_IMAGE=${{ env.REGISTRY }}/${{ steps.img.outputs.runtime }}:${{ github.sha }}
            RAILS_ADMIN_EMAIL=${{ secrets.RAILS_ADMIN_EMAIL }}
            RAILS_API_URL=${{ secrets.RAILS_API_URL || 'https://api.yeezyunique.ru/api/v1' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
